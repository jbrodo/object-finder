name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_URL/SUPABASE_ANON_KEY assenti: APK senza Supabase (solo offline)"
            exit 0
          fi
          # Nell'app va solo la chiave anon/publishable: una chiave privilegiata scavalca la RLS.
          if [[ "$SUPABASE_ANON_KEY" == sb_secret_* ]]; then
            echo "::error::SUPABASE_ANON_KEY è una Secret key: usare la Publishable/anon key"; exit 1
          fi
          payload=$(echo "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          if echo "$payload" | grep -q '"service_role"'; then
            echo "::error::SUPABASE_ANON_KEY è la service_role key: usare la anon key"; exit 1
          fi
          # Solo l'URL base del progetto: l'app aggiunge da sé /rest/v1, /auth/v1, /storage/v1.
          SUPABASE_URL=$(echo "$SUPABASE_URL" | sed -E 's#/+$##; s#/(rest|auth|storage)/v1/*$##; s#/+$##')
          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "::error::SUPABASE_URL deve iniziare con https://"; exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" \
            > android/app/src/main/assets/config.properties
          echo "Supabase configurato: $SUPABASE_URL"

      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Assemble debug APK
        working-directory: android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        # versionCode crescente a ogni run: l'APK nuovo è sempre un aggiornamento del precedente.
        # Aggiornare la versione base quando cambia la versione dell'app; le release usano il tag Git.
        run: >
          ./gradlew --no-daemon :app:assembleDebug
          -PGOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
          -PVERSION_CODE="${{ github.run_number }}"
          -PVERSION_NAME="1.6.1-ci.${{ github.run_number }}"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: object-finder-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
