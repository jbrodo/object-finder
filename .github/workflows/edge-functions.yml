name: Edge functions

# Test e deploy delle Edge Function Supabase (backend/supabase/functions) quando cambiano.
# Deploy solo da main, nell'environment `production`, e solo se i secret sono presenti:
#   SUPABASE_ACCESS_TOKEN  token personale (supabase.com → Account → Access Tokens)
#   SUPABASE_URL           già usato per l'APK: da qui si ricava il project ref
#   RESEND_API_KEY         chiave del servizio email (resend.com)
#   INVITE_FROM            mittente verificato, es. "Object Finder <inviti@tuodominio.it>"
#   PLANTNET_API_KEY       facoltativo: chiave my.plantnet.org per il riconoscimento piante online
#                          (senza, `identify-plant` risponde not_configured e l'app usa il modello offline)
on:
  push:
    branches: [main]
    paths:
      - "backend/supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
  pull_request:
    paths:
      - "backend/supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Unit tests and type check
        working-directory: backend/supabase/functions
        run: |
          for fn in send-invite identify-plant; do
            (cd "$fn" && deno test && deno check index.ts)
          done

  deploy:
    name: Deploy to Supabase
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: edge-functions-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      INVITE_FROM: ${{ secrets.INVITE_FROM }}
      PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
      SUPABASE_CLI: supabase@2.122.1
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN o SUPABASE_URL assenti: funzioni non pubblicate (vedi README, Email di invito)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # https://<ref>.supabase.co[/...] → <ref>
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*$#\1#')
          if ! [[ "$ref" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::Impossibile ricavare il project ref da SUPABASE_URL"; exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Set function secrets
        if: steps.secrets.outputs.deploy == 'true'
        working-directory: backend
        run: |
          : > "$RUNNER_TEMP/functions.env"
          if [ -n "$RESEND_API_KEY" ] && [ -n "$INVITE_FROM" ]; then
            printf 'RESEND_API_KEY=%s\nINVITE_FROM=%s\n' "$RESEND_API_KEY" "$INVITE_FROM" >> "$RUNNER_TEMP/functions.env"
          else
            echo "::warning::RESEND_API_KEY o INVITE_FROM assenti: la funzione risponderà 'invio non configurato' e l'app proporrà la condivisione manuale."
          fi
          if [ -n "$PLANTNET_API_KEY" ]; then
            printf 'PLANTNET_API_KEY=%s\n' "$PLANTNET_API_KEY" >> "$RUNNER_TEMP/functions.env"
          else
            echo "::warning::PLANTNET_API_KEY assente: riconoscimento piante solo sul telefono (modello offline)."
          fi
          if [ ! -s "$RUNNER_TEMP/functions.env" ]; then rm -f "$RUNNER_TEMP/functions.env"; exit 0; fi
          npx --yes "$SUPABASE_CLI" secrets set --env-file "$RUNNER_TEMP/functions.env" --project-ref "${{ steps.secrets.outputs.ref }}"
          rm -f "$RUNNER_TEMP/functions.env"

      - name: Deploy send-invite
        if: steps.secrets.outputs.deploy == 'true'
        working-directory: backend
        # JWT verificato dentro la funzione (/auth/v1/user): compatibile anche con le nuove chiavi API.
        run: npx --yes "$SUPABASE_CLI" functions deploy send-invite --project-ref "${{ steps.secrets.outputs.ref }}" --no-verify-jwt --use-api

      - name: Deploy identify-plant
        if: steps.secrets.outputs.deploy == 'true'
        working-directory: backend
        run: npx --yes "$SUPABASE_CLI" functions deploy identify-plant --project-ref "${{ steps.secrets.outputs.ref }}" --no-verify-jwt --use-api
