name: Database migrations

# Quando cambiano le migration:
# - su pull request: validazione su un Postgres+PostGIS temporaneo (nessun accesso al DB reale);
# - su push a main: validazione, poi applicazione delle sole migration pendenti al DB Supabase.
# Avvio manuale: dry-run o baseline (per migration già eseguite a mano dal SQL Editor).
on:
  push:
    branches: [main]
    paths:
      - "backend/migrations/**"
      - "backend/scripts/migrate.sh"
      - "backend/tests/**"
      - ".github/workflows/db-migrate.yml"
  pull_request:
    paths:
      - "backend/migrations/**"
      - "backend/scripts/migrate.sh"
      - "backend/tests/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo elenco delle migration pendenti, senza applicarle"
        type: boolean
        default: true
      baseline:
        description: "Segna come già applicate le versioni fino a questa inclusa (es. 007), senza eseguirle"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate on a temporary database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      # template0: senza PostGIS preinstallato in public (su Supabase sta nello schema extensions).
      - name: Create empty database with Supabase stub
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "create database migrations_ci template template0"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/tests/supabase_stub.sql

      - name: Apply all migrations
        run: backend/scripts/migrate.sh

      - name: Second run applies nothing
        run: |
          out=$(backend/scripts/migrate.sh)
          echo "$out"
          grep -q "completato: 0 migration applicate" <<<"$out"

      - name: SQL tests
        run: |
          for f in backend/tests/*_test.sql; do
            echo "== $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -t -f "$f"
          done

  deploy:
    name: Apply to Supabase
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Configurando l'environment "production" in Settings → Environments si può richiedere
    # un'approvazione manuale prima di toccare il database.
    environment: production
    concurrency:
      group: db-migrate-production
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check database secret
        id: secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret SUPABASE_DB_URL assente: migration non applicate. Vedi README (Migration automatiche)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install psql
        if: steps.secret.outputs.present == 'true'
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Pending migrations
        if: steps.secret.outputs.present == 'true'
        env:
          BASELINE: ${{ github.event.inputs.baseline }}
        run: backend/scripts/migrate.sh --dry-run ${BASELINE:+--baseline "$BASELINE"}

      - name: Apply migrations
        if: steps.secret.outputs.present == 'true' && (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
        env:
          BASELINE: ${{ github.event.inputs.baseline }}
        run: backend/scripts/migrate.sh ${BASELINE:+--baseline "$BASELINE"}
